<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>$app_name</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #e4e4e7;border-radius:12px;">
            <tr>
              <td style="padding:32px 32px 8px 32px;font-size:18px;font-weight:600;">$app_name</td>
            </tr>
            <tr>
              <td style="padding:8px 32px 32px 32px;font-size:15px;line-height:1.6;">
$content
              </td>
            </tr>
          </table>
          <p style="max-width:520px;margin:16px auto 0;font-size:12px;color:#71717a;">
            Questions? Contact <a href="mailto:$support_email" style="color:#71717a;">$support_email</a>.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
